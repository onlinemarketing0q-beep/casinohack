/* 🔥 PREMIUM WHATSAPP BUTTON */
.whatsapp-btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:16px 38px;
    background: linear-gradient(90deg,#25d366,#1ebe5d);
    color:#ffffff;
    font-size:18px;
    font-weight:700;
    text-decoration:none;
    border-radius:50px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(37,211,102,0.6);
    transition: all 0.25s ease;
    animation: pulseGlow 2s infinite;
}

.whatsapp-btn:hover{
    transform: translateY(-3px) scale(1.06);
    box-shadow:0 0 35px rgba(37,211,102,1);
}

.whatsapp-btn:active{
    transform: scale(0.96);
}

/* Shine moving light */
.whatsapp-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-75%;
    width:50%;
    height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
    transform:skewX(-25deg);
    animation: shineMove 3s infinite;
}

@keyframes pulseGlow{
    0%{box-shadow:0 0 15px rgba(37,211,102,0.5);}
    50%{box-shadow:0 0 35px rgba(37,211,102,1);}
    100%{box-shadow:0 0 15px rgba(37,211,102,0.5);}
}

@keyframes shineMove{
    0%{left:-75%;}
    100%{left:130%;}
}

.footer{
    margin-top:25px;
    font-size:11px;
    color:#888;
    line-height:1.5;
